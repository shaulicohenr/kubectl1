apiVersion: v1
kind: Service
metadata:
  name: cohen-clusterip
  namespace: cohen-environment
spec:
  selector:
    app: flask
  ports:
    - port: 80
      targetPort: 5000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-deployment
  namespace: cohen-environment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flask
  template:
    metadata:
      labels:
        app: flask
    spec:
      containers:
        - name: flask
          image: flask
