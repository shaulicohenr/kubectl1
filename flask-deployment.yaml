apiVersion: v1
kind: Namespace
metadata:
  name: cohen-environment
---
apiVersion: v1
kind: Service
metadata:
  name: cohen-clusterIP
spec:
  type: ClusterIP
  selector:
    app: nginx
  ports:
    - protocol: TCP
      port: 80 # ClusterIP's Port
      targetPort: 5000 # Pod's Port
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flask
  template:
    metadata:
      labels:
        app: flask
    spec:
      containers:
        - name: flask
          image: flask
