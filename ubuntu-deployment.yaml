apiVersion: apps/v1
kind: Deployment
metadata:
  name: ubuntu-time
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ubuntu
  template:
    metadata:
      labels:
        app: ubuntu
    spec:
      containers:
        - name: ubuntu
          image: ubuntu:22.04
          command: ["/bin/bash", "-c", "while true; do echo \"Current Time: $(date)'\"; sleep 5; done"]


